name: FastAPI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: ecommerce_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:

      TESTING: "1"

      DB_CONNECTION: postgresql://postgres:postgres123@localhost:5432/ecommerce_test_db

      REDIS_URL: redis://localhost:6379

      SECRET_KEY: testsecret
      ALGORITHM: HS256
      EXPIRY_TIME: 60

      ADMIN_NAME: Admin
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@123

      BREVO_API_KEY: dummy
      EMAIL_FROM: dummy@example.com
      EMAIL_FROM_NAME: Test

      GROQ_API_KEY: dummy
      GROQ_MODEL: llama-3.3-70b-versatile

      RAZORPAY_KEY_ID: dummy
      RAZORPAY_KEY_SECRET: dummy
      RAZORPAY_WEBHOOK_SECRET: dummy

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run Tests
        run: |
          pytest -v